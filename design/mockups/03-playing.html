<!doctype html>
<html lang="id"><head><meta charset="utf-8"><title>Emotion Rush · playing</title><link rel="stylesheet" href="board.css"></head>
<body>
  <div class="ghost c4" style="left:20px;top:150px;width:200px;height:300px"></div>
  <div class="ghost a6" style="left:1380px;top:560px;width:200px;height:300px"></div>

  <!-- camera pinned straight for the exam; progress pins hold its left border -->
  <div class="cam" style="left:270px;top:110px;width:1060px;height:700px"><div class="feed">kamera live · kotak wajah per pemain</div></div>
  <div class="abs" style="left:265px;top:170px;display:flex;flex-direction:column;gap:30px">
    <span class="pin done" style="position:static"></span><span class="pin done" style="position:static"></span><span class="pin" style="position:static"></span><span class="pin off" style="position:static"></span><span class="pin off" style="position:static"></span><span class="pin off" style="position:static"></span><span class="pin off" style="position:static"></span>
  </div>

  <div class="label pnk a3" style="left:390px;top:50px;font-size:56px;white-space:nowrap">3/7 · PEMBELAJARAN MESIN UNTUK SEDIH</div>

  <!-- left: record, tucked over the photo edge -->
  <div class="paper c4" style="left:70px;top:540px;width:220px;padding:16px;text-align:center">
    <span style="font-size:24px;font-weight:700;font-stretch:85%">Rekor</span>
    <b class="num" style="display:block;font-size:96px;font-weight:900;font-stretch:62%;line-height:1">74</b>
  </div>

  <!-- right chain: timer, then the reassurance label -->
  <div class="paper c4" style="left:1300px;top:140px;width:230px;padding:14px;text-align:center">
    <b class="num" style="display:block;font-size:120px;font-weight:900;font-stretch:62%;line-height:1">4,2</b>
    <span style="font-size:24px;font-weight:700">detik</span>
  </div>
  <div class="label a6" style="left:1300px;top:310px;width:260px;background:#fff;font-size:34px">FOTO TERBAIK OTOMATIS TERSIMPAN</div>

  <!-- bottom: live score overlapping the photo's lower edge -->
  <div class="paper a3" style="left:320px;top:775px;width:960px;height:72px;display:flex;align-items:center;gap:20px;padding:0 22px">
    <span style="font-size:26px;font-weight:800;font-stretch:80%">NILAI LIVE</span>
    <div style="flex:1;height:34px;position:relative"><div style="position:absolute;left:0;top:0;bottom:0;width:68%;background:#FF3D8B"></div></div>
    <b class="num" style="font-size:48px;font-weight:900;font-stretch:62%">68</b>
  </div>
</body></html>
